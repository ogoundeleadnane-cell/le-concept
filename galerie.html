<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie – Restaurant Leconcept, Ouèdo</title><meta name="description" content="Galerie photos : pizzas, chawarmas, grillades, poissons braisés, spécialités africaines et ambiance du restaurant Leconcept."><meta property="og:title" content="Galerie – Restaurant Leconcept, Ouèdo"><meta property="og:description" content="Galerie photos : pizzas, chawarmas, grillades, poissons braisés, spécialités africaines et ambiance du restaurant Leconcept."><meta property="og:type" content="restaurant"><meta property="og:locale" content="fr_BJ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--noir:#081a2e;--noir2:#102a47;--creme:#f2ede2;--blanc:#faf8f3;--cuivre:#b3182c;--or:#cfd3d9;--r:14px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:400 17px/1.65 'Figtree',system-ui,sans-serif;background:var(--blanc);color:var(--noir)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.12;font-weight:600}
h1{font-size:clamp(2.6rem,7vw,5.2rem)}h2{font-size:clamp(1.9rem,4vw,3rem)}h3{font-size:1.25rem}
a{color:inherit}img{max-width:100%}
.wrap{max-width:1180px;margin:auto;padding:0 22px}.sec{padding:88px 0}.dark{background:var(--noir);color:var(--creme)}.cream{background:var(--creme)}
.lead{max-width:60ch;opacity:.85;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;border:1.5px solid var(--cuivre);background:var(--cuivre);color:#fff;font:600 16px 'Figtree';cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(179,24,44,.35)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:inherit}.btn.ghost:hover{background:var(--cuivre);color:#fff}
.btn.sm{padding:9px 18px;font-size:15px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
/* nav */
header{position:fixed;inset:0 0 auto;z-index:50;transition:.3s;padding:20px 0}
header.on{background:rgba(18,13,10,.94);padding:9px 0;backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{display:inline-flex;align-items:center;gap:10px;font:600 1.5rem 'Fraunces',serif;color:var(--creme);text-decoration:none}.logo b{color:var(--or)}
nav{display:flex;gap:26px;align-items:center}nav a{color:var(--creme);text-decoration:none;font-size:15px;position:relative}
nav a.cur:after,nav a:not(.btn):hover:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:var(--or)}
.cartbtn{position:relative;background:none;border:0;color:var(--creme);font-size:22px;cursor:pointer}
.cartbtn i{position:absolute;top:-8px;right:-10px;background:var(--cuivre);color:#fff;border-radius:99px;font:700 11px/1 'Figtree';padding:3px 6px;font-style:normal}
.burger{display:none;background:none;border:0;color:var(--creme);font-size:28px;cursor:pointer}
@media(max-width:860px){.burger{display:block}nav{position:fixed;inset:0 0 0 30%;background:var(--noir);flex-direction:column;justify-content:center;gap:28px;transform:translateX(100%);transition:.35s}nav.open{transform:none}nav a{font-size:20px}}
/* hero */
.hero{min-height:100svh;display:flex;align-items:center;color:var(--creme);background:radial-gradient(ellipse at 75% 30%,#7a1424 0,transparent 55%),radial-gradient(ellipse at 10% 90%,#12305a 0,transparent 50%),var(--noir);position:relative;overflow:hidden}
.hero h1{max-width:12ch}.hero p{max-width:46ch;margin:22px 0 32px;font-size:1.15rem;opacity:.9}
.hero .btns{display:flex;gap:14px;flex-wrap:wrap}
.hero .plate{position:absolute;right:-60px;top:50%;translate:0 -50%;width:min(52vw,560px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e04a5a,#b3182c 45%,#5c0d19);display:grid;place-items:center;font-size:min(22vw,230px);box-shadow:0 0 0 18px rgba(207,211,217,.08),0 0 0 44px rgba(207,211,217,.05);animation:spin 60s linear infinite}
.hero .plate span{animation:spin 60s linear infinite reverse}@keyframes spin{to{rotate:360deg}}
@media(max-width:860px){.hero .plate{opacity:.28;right:-120px}}
.badges{display:flex;gap:28px;flex-wrap:wrap;margin-top:38px;font-size:15px;color:var(--or)}
.page-head{padding:150px 0 60px;background:var(--noir);color:var(--creme)}
/* cards */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:36px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;margin-top:40px}
.feat div{border-top:2px solid var(--cuivre);padding-top:14px}.feat p{opacity:.8;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:thin}
.tabs button{white-space:nowrap;padding:9px 18px;border-radius:99px;border:1.5px solid #c4c8cf;background:transparent;font:500 15px 'Figtree';cursor:pointer;transition:.2s}
.tabs button.on,.tabs button:hover{background:var(--noir);color:var(--creme);border-color:var(--noir)}
.dish{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(8,26,46,.08);transition:transform .25s,box-shadow .25s}
.dish:hover{transform:translateY(-5px);box-shadow:0 14px 32px rgba(8,26,46,.16)}
.ph{aspect-ratio:16/10;display:grid;place-items:center;font-size:64px;background-size:cover;background-position:center;position:relative}
.dish .in{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.dish p{font-size:14.5px;opacity:.75;flex:1}
.tag{font-size:12.5px;color:var(--cuivre);font-weight:600}
.fmts{display:flex;gap:8px;flex-wrap:wrap}
.fmts label{flex:1;min-width:90px;cursor:pointer}.fmts input{position:absolute;opacity:0}
.fmts span{display:block;text-align:center;border:1.5px solid #cfd2d8;border-radius:10px;padding:6px 8px;font-size:14px;transition:.2s}
.fmts input:checked+span{background:var(--noir);color:var(--or);border-color:var(--noir)}
.fmts input:focus-visible+span{outline:3px solid var(--or)}
.price{font:600 1.15rem 'Fraunces',serif;color:var(--cuivre)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.chips span{padding:8px 16px;border:1.5px solid var(--cuivre);border-radius:99px}
.note{margin-top:18px;font-size:14.5px;opacity:.75}
/* gallery */
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px;margin-top:36px}
.mosaic button{border:0;border-radius:var(--r);cursor:pointer;font-size:60px;position:relative;overflow:hidden;background-size:cover;transition:transform .3s}
.mosaic button:hover{transform:scale(1.02)}.mosaic .w{grid-column:span 2}.mosaic .t{grid-row:span 2}
.mosaic em{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:500 14px 'Figtree';font-style:normal;text-align:left}
@media(max-width:720px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px}}
.lb{position:fixed;inset:0;background:rgba(10,6,3,.94);z-index:90;display:none;place-items:center;color:#fff;text-align:center;padding:20px}.lb.on{display:grid}
.lb .big{width:min(90vw,720px);aspect-ratio:4/3;border-radius:var(--r);display:grid;place-items:center;font-size:150px;background-size:cover;margin-bottom:14px}
.lb button.x{position:absolute;top:18px;right:22px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer}
/* avis */
.score{font:600 4rem 'Fraunces',serif;color:var(--or)}
.quotes{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:30px}
blockquote{background:var(--noir2);padding:26px;border-radius:var(--r);border-left:3px solid var(--cuivre);font-family:'Fraunces',serif;font-size:1.05rem}
/* contact */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.two ul{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
iframe{width:100%;height:380px;border:0;border-radius:var(--r)}
footer{background:var(--noir);color:var(--creme);padding:60px 0 30px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:34px}@media(max-width:760px){.fgrid{grid-template-columns:1fr}}
footer a{display:block;text-decoration:none;opacity:.8;margin:5px 0}footer a:hover{opacity:1;color:var(--or)}
.copy{margin-top:36px;padding-top:18px;border-top:1px solid #20364f;font-size:14px;opacity:.7}
.fab{position:fixed;right:18px;z-index:40;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;font-size:24px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#wa{bottom:20px;background:#25d366;color:#fff}#top{bottom:82px;background:var(--noir);color:var(--or);display:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,6,3,.7);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}.ov.on{display:flex}
.mod{background:var(--blanc);width:min(680px,100%);max-height:94svh;overflow:auto;border-radius:22px 22px 0 0;padding:26px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.ov{align-items:center}.mod{border-radius:22px}}
.mod h2{font-size:1.8rem;margin-bottom:4px}.mod h3{margin:22px 0 10px;font-size:1.1rem}
.mod label.f{display:block;font-size:14px;font-weight:600;margin-top:12px}
.mod input,.mod textarea,.mod select{width:100%;padding:11px 13px;border:1.5px solid #cfd2d8;border-radius:10px;font:16px 'Figtree';background:#fff;margin-top:4px}
.mod input.bad,.mod textarea.bad{border-color:#c0392b}.err{color:#c0392b;font-size:13.5px;min-height:1em}
.seg{display:flex;gap:10px}.seg label{flex:1;margin:0}.seg input{position:absolute;opacity:0;width:auto}.seg span{display:block;text-align:center;border:1.5px solid #cfd2d8;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.seg input:checked+span{background:var(--noir);color:var(--or);border-color:var(--noir)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e3e1da}.line .n{flex:1;font-size:15px}.line small{opacity:.65;display:block}
.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;border-radius:50%;border:1.5px solid #c4c8cf;background:#fff;cursor:pointer;font-size:17px}
.rm{background:none;border:0;cursor:pointer;color:#c0392b;font-size:18px}
.sum{background:var(--creme);border-radius:var(--r);padding:16px;margin-top:16px}.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .tt{font:600 1.2rem 'Fraunces',serif;border-top:1px solid #c4c8cf;margin-top:6px;padding-top:8px}
.acts{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.acts .btn{flex:1;justify-content:center}
.warn{background:#fff3d6;border:1px solid var(--or);border-radius:10px;padding:12px;font-size:14.5px;margin-top:14px;display:none}.warn.on{display:block}
.toast{position:fixed;left:50%;bottom:90px;translate:-50% 0;background:var(--noir);color:var(--creme);padding:12px 20px;border-radius:99px;z-index:120;opacity:0;pointer-events:none;transition:.3s}.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.logo img{height:42px;width:auto;border-radius:8px}.hero .btn.ghost{border-color:var(--or)}.btn.ghost:hover{border-color:var(--cuivre)}.hero .btn:not(.ghost){background:var(--cuivre)}.price,.tag{color:var(--cuivre)}.dark .score{color:var(--or)}

.list{list-style:none;padding:0;margin-top:24px;background:#fff;border-radius:var(--r);box-shadow:0 2px 14px rgba(8,26,46,.08)}
.row-d{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid #e3e1da;transition:background .2s}.row-d:last-child{border:0}.row-d:hover{background:#faf8f3}
.d-main h3{font-size:1.1rem}.d-main p{font-size:14px;opacity:.7;margin-top:2px}
.d-buy{display:flex;align-items:center;gap:14px;flex-shrink:0}.d-buy .fmts label{min-width:0;flex:none}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row-d{flex-direction:column;align-items:stretch;gap:10px;padding:16px}.d-buy{justify-content:space-between}}

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const F=n=>String(n).replace(/\B(?=(\d{3})+$)/g,' ');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const save=()=>{try{localStorage.setItem('lc_cart',JSON.stringify(cart))}catch(e){}$$('.cartn').forEach(b=>b.textContent=cart.reduce((a,l)=>a+l.qty,0))};
const sub=()=>cart.reduce((a,l)=>a+l.price*l.qty,0);
function addItem(name,price,fmt){const k=name+'|'+price;const l=cart.find(x=>x.k===k);l?l.qty++:cart.push({k,name,price,fmt,qty:1});save();toast(name+' ajouté')}

  chk('nom','Indiquez votre nom.',v=>v.length>1);chk('pre','Indiquez votre prénom.',v=>v.length>1);chk('tel','Indiquez un numéro valide (8 chiffres minimum).',v=>v.replace(/\D/g,'').length>=8);
